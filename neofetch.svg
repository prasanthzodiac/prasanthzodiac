<svg xmlns="http://www.w3.org/2000/svg" width="840" height="880" viewBox="0 0 840 880" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,Courier New,monospace">
<defs>
  <linearGradient id="wbg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#111722"/>
    <stop offset="100%" stop-color="#0d1117"/>
  </linearGradient>
</defs>
<style>
  .ascii-logo {
    fill: #58a6ff;
    font-size: 13.5px;
    font-weight: 700;
    opacity: 0;
    animation: fadein 0.4s ease-out both;
  }
  .spec-row {
    opacity: 0;
    transform-box: fill-box;
    animation: slidein 0.35s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  .term-box {
    opacity: 0;
    animation: fadein 0.5s ease-out both;
  }
  .cursor {
    fill: #3fb950;
    font-weight: 700;
    font-size: 18px;
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes fadein {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes slidein {
    from { opacity: 0; transform: translateX(-12px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ascii-logo, .spec-row, .term-box { opacity: 1 !important; animation: none !important; }
    .cursor { animation: none !important; }
  }
</style>

