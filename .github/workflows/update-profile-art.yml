name: Update Profile Art

# Auto-refreshes the animated contribution heatmap and stats SVGs daily from real data.
# Runs daily at 00:00 UTC, on push to main, and on manual trigger.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'

permissions:
  contents: write

jobs:
  refresh-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Scrape live contribution data (unauthenticated)
        run: python scripts/fetch_contributions.py data/contributions.json
        env:
          GH_PROFILE_USER: prasanthzodiac

      - name: Render animated contribution heatmap SVG
        run: python scripts/generate_streak_svg.py prasanthzodiac contrib-heatmap.svg

      - name: Render streak and activity stats SVG
        run: python scripts/render_stats_svg.py data/contributions.json stats.svg

      - name: Render Neofetch terminal card SVG
        run: python scripts/render_neofetch_svg.py

      - name: Commit refreshed art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(art): refresh live contribution graphs [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats.svg neofetch.svg"
